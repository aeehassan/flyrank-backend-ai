:root{--bg:#FAFAF8;--tx:#1F2933;--st:#57534E;--bt:#fff;--cS:#2563EB;--tS:#DBEAFE;--cU:#0F766E;--tU:#CCFBF1;--cR:#C2410C;--tR:#FFEDD5}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);overflow:hidden;font-family:Inter,sans-serif;color:var(--tx)}
#st{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:center}
.s{position:absolute;inset:0;padding:40px 64px;visibility:hidden}
.s.a{visibility:visible}
h1{font:700 40px Poppins,sans-serif;margin-top:14px}
.b{display:inline-block;font:700 14px Inter,sans-serif;color:var(--bt);padding:6px 18px;border-radius:999px}
.row{display:flex;gap:48px;align-items:center;height:520px}
.L{width:700px}.r{flex:1}
.d{width:100%;display:block}
.ex{font-size:24px;line-height:1.5}
.u{font-size:22px;line-height:1.5;margin-top:28px}
.top{display:flex;align-items:center;gap:20px;margin-bottom:6px}.top h1{margin:0}
.full .d{height:480px}
.ctl{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:10px;font-size:20px;color:var(--st)}
.ctl input{width:420px;accent-color:var(--c)}
.ctl button{font:700 20px Inter,sans-serif;padding:10px 26px;border-radius:999px;border:2px solid var(--c);background:var(--bg);color:var(--tx);cursor:pointer}
.ctl button.on,.ctl button.p{background:var(--c);color:var(--bt)}
.t1{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 120px}
.t1 h1{font-size:54px;line-height:1.25;margin:0}
.t1 p{font-size:26px;color:var(--st);margin-top:28px}
.bar{display:flex;width:240px;height:6px;margin-top:36px}.bar i{flex:1}
.cols{display:flex;gap:28px;margin-top:28px;height:470px}
.col{flex:1;border-radius:16px;padding:26px 28px}
.col p{font-size:22px;line-height:1.4;margin-top:18px}
.col li{font-size:24px;line-height:1.5;margin:12px 0 0 22px}
.col dl dt{font:700 22px Inter,sans-serif;margin-top:20px}.col dl dd{font-size:21px;line-height:1.4;margin-top:4px}
.end{text-align:center;font:700 28px Poppins,sans-serif;margin-top:22px}
.nv{position:absolute;right:14px;bottom:12px;display:flex;gap:8px;z-index:5}
.nv button{width:36px;height:36px;border-radius:50%;border:1px solid var(--st);background:var(--bg);color:var(--st);font-size:18px;cursor:pointer;opacity:.5}
.nv button:hover{opacity:1}
body,.col,.b,.ctl button,.nv button{transition:background-color .4s,color .4s,border-color .4s}
.tg{position:fixed;top:16px;right:18px;z-index:9;width:64px;height:32px;border-radius:16px;border:1.5px solid var(--st);background:var(--bg);padding:0;cursor:pointer;transition:background-color .4s,border-color .4s}
.kn{position:absolute;top:2px;left:2px;width:25px;height:25px;border-radius:50%;background:var(--tx);transition:transform .5s cubic-bezier(.5,-.4,.3,1.4),background-color .4s}
body[data-m=dark] .kn{transform:translateX(32px)}
.kn svg{position:absolute;left:3.5px;top:3.5px;width:18px;height:18px;fill:var(--bg);stroke:var(--bg);transition:transform .5s,opacity .3s}
.kn .moon{opacity:0;transform:rotate(-90deg) scale(.4);stroke:none}
body[data-m=dark] .kn .sun{opacity:0;transform:rotate(90deg) scale(.4)}
body[data-m=dark] .kn .moon{opacity:1;transform:none}
.fb{display:flex;gap:10px}.fr{display:flex;align-items:center;height:580px}.ft{flex:1;padding-right:20px}
.ft h1{font-size:60px;line-height:1.2;margin:0}.ft p{font-size:40px;color:var(--st);margin-top:24px}
#fx{width:600px;height:560px;flex:none}.nd{cursor:pointer}
.nd circle{transition:transform .2s;transform-box:fill-box;transform-origin:center}.nd:hover circle{transform:scale(1.3)}
.qm{transform-box:fill-box;transform-origin:center;animation:br 3.5s ease-in-out infinite alternate}
@keyframes br{to{transform:scale(1.18)}}
@media(prefers-reduced-motion:reduce){.qm{animation:none}.kn,.kn svg{transition:none}}
.s.a{z-index:2;animation:inf .35s ease-out both}
.s.o{z-index:1;visibility:visible;animation:out .2s ease-in both;pointer-events:none}
body[data-d=b] .s.a{animation-name:inb}
body[data-d=f] .s.full.a{animation:zin .45s ease-out both}
@keyframes inf{from{opacity:0;transform:translateX(24px)}}
@keyframes inb{from{opacity:0;transform:translateX(-24px)}}
@keyframes zin{from{opacity:0;transform:scale(.96)}}
@keyframes out{to{opacity:0}}
@keyframes fu{from{opacity:0;transform:translateY(16px)}}
@keyframes fi{from{opacity:0}}
@keyframes sl{from{opacity:0;transform:translateX(-48px)}}
@keyframes dw{from{clip-path:inset(0 100% 0 0)}}
@keyframes dr{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes hf{from{opacity:.3}}
.s.t1.a h1{animation:fu .5s .1s both}
.s.t1.a .bar{animation:dw .5s .35s both}
.s.t1.a p{animation:fi .4s .6s both}
.s.a .col{animation:fu .5s both}
.s.a .col:nth-child(2){animation-delay:.12s}.s.a .col:nth-child(3){animation-delay:.24s}
.s.a .end{animation:fi .5s .5s both}
.s.a .row .L{animation:sl .5s ease-out both}
.s.a .row .ex{animation:fi .5s .45s both}.s.a .row .u{animation:fi .5s .6s both}
.s.a .ft h1{animation:fu .6s both}.s.a .ft p{animation:fu .6s .35s both}
.an .ln{stroke-dasharray:1;animation:dr .6s .3s ease-out both}
.an .tn,.an .te{animation:fi .4s both;animation-delay:calc(.3s + var(--i)*.2s)}
.hl{animation:hf .4s both}
.ctl button,.nv button{transition:background-color .4s,color .4s,border-color .4s,transform .15s}
.ctl button:hover,.nv button:hover{transform:translateY(-2px)}
.ctl button:active,.nv button:active{transform:scale(.96)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.s.o{visibility:hidden}}

s+=`<line x1="60" y1="${ly(60)}" x2="570" y2="${ly(570)}" stroke="${B}" stroke-width="3.5" stroke-linecap="round" class="ln" pathLength="1"/>`;
const x=60+st.lr*5,y=ly(x);
s+=`<line x1="${x}" y1="250" x2="${x}" y2="${y}" stroke="${B}" stroke-dasharray="5 4"/><line x1="60" y1="${y}" x2="${x}" y2="${y}" stroke="${B}" stroke-dasharray="5 4"/><circle cx="${x}" cy="${y}" r="9" fill="${B}"/>`;
return s+T(315,280,'House size')+T(68,16,'Price',{a:'start'})+T(x,y-16,'Prediction',{f:B,w:1})}

const TN=[{id:'r',x:300,y:40,w:190,t:'Income over $30k?'},{id:'l',x:170,y:130,w:130,t:'Low debt?'},{id:'rr',x:430,y:130,w:110,t:'Reject',leaf:1},{id:'a',x:90,y:220,w:110,t:'Approve',leaf:1},{id:'rj',x:250,y:220,w:110,t:'Reject',leaf:1}];
const TE=[['r','l','Yes'],['r','rr','No'],['l','a','Yes'],['l','rj','No']];
const TP=[{n:'Applicant A',nd:['r','l','a'],e:[0,2]},{n:'Applicant B',nd:['r','l','rj'],e:[0,3]},{n:'Applicant C',nd:['r','rr'],e:[1]}];
function tree(st){const B=F.S.c,p=TP[st.tree],g=id=>TN.find(n=>n.id==id);let s='';
TE.forEach((e,i)=>{const a=g(e[0]),b=g(e[1]),on=p.e.includes(i);
s+=`<line class="te${on?' hl':''}" style="--i:${(b.y-40)/90}" x1="${a.x}" y1="${a.y+20}" x2="${b.x}" y2="${b.y-20}" stroke="${on?B:ST}" stroke-width="${on?4:1.5}" opacity="${on?1:.45}"/>`+T((a.x+b.x)/2+(b.x<a.x?-18:18),(a.y+b.y)/2+4,e[2],{f:on?B:ST,w:on})});
TN.forEach(n=>{const on=p.nd.includes(n.id);s+=`<g class="tn${on?' hl':''}" style="--i:${(n.y-40)/90}"><rect x="${n.x-n.w/2}" y="${n.y-20}" width="${n.w}" height="40" rx="${n.leaf?20:6}" fill="${on?B:F.S.t}" stroke="${B}" stroke-width="1.5"/>`+T(n.x,n.y+5,n.t,{f:on?P.bt:TX,w:1})+'</g>'});
return s+T(480,230,p.n+': '+(p.nd[p.nd.length-1]=='a'?'approved':'rejected'),{f:B,w:1})}

const KA=[[250,190],[240,120],[260,100],[200,160],[190,90],[150,200]],KB=[[345,165],[390,120],[370,210],[440,160],[420,90],[340,230]],NP=[300,150];
const KS=KA.map(p=>({p:p,c:'A'})).concat(KB.map(p=>({p:p,c:'B'}))).map(o=>({p:o.p,c:o.c,d:Math.hypot(o.p[0]-NP[0],o.p[1]-NP[1])})).sort((a,b)=>a.d-b.d);const kR=k=>KS[k-1].d+6;
function knn(st){const k=st.knn,B=F.S.c;
const all=KS;
const nb=all.slice(0,k),na=nb.filter(o=>o.c=='A').length,nbb=k-na,win=na>nbb?'A':'B';
let s=`<circle cx="${NP[0]}" cy="${NP[1]}" r="${st.knr??kR(k)}" fill="${F.S.t}" opacity=".6" stroke="${B}" stroke-dasharray="5 4"/>`;
KA.forEach(p=>s+=`<circle cx="${p[0]}" cy="${p[1]}" r="7" fill="${B}"/>`);
KB.forEach(p=>s+=`<rect x="${p[0]-7}" y="${p[1]-7}" width="14" height="14" fill="${ST}"/>`);
nb.forEach(o=>s+=`<circle cx="${o.p[0]}" cy="${o.p[1]}" r="13" fill="none" stroke="${B}" stroke-width="2.5"/>`);
s+=win=='A'?`<circle cx="${NP[0]}" cy="${NP[1]}" r="9" fill="${B}" stroke="${TX}" stroke-width="3"/>`:`<rect x="${NP[0]-9}" y="${NP[1]-9}" width="18" height="18" fill="${ST}" stroke="${TX}" stroke-width="3"/>`;
return s+T(20,22,'k = '+k,{a:'start',w:1,f:B,s:18})+T(300,276,`Vote: ${na} circle${na==1?'':'s'}, ${nbb} square${nbb==1?'':'s'}. The new point (thick outline) becomes a ${win=='A'?'circle':'square'}.`)}

const KG=[[130,90,[[-30,-10],[0,-30],[25,0],[-10,25],[20,-20]]],[300,210,[[-25,10],[10,-25],[30,5],[-5,28],[-30,-15]]],[480,90,[[-20,-5],[15,-25],[30,10],[0,25],[-25,20]]]];
const KP=[];KG.forEach(g=>g[2].forEach(o=>KP.push([g[0]+o[0],g[1]+o[1]])));
const KC=[[160,120],[330,240],[450,70]];
function km(st){const U=F.U.c,n=st.km;
const asg=KP.map(p=>{let b=0,bd=1e9;KC.forEach((c,i)=>{const d=Math.hypot(p[0]-c[0],p[1]-c[1]);if(d<bd){bd=d;b=i}});return b});
const mc=KC.map((c,i)=>{const m=KP.filter((p,j)=>asg[j]==i);return [m.reduce((a,p)=>a+p[0],0)/m.length,m.reduce((a,p)=>a+p[1],0)/m.length]});
const d=st.kmd??n,a1=Math.min(1,d),a2=Math.max(0,Math.min(1,d-1)),a3=Math.max(0,Math.min(1,d-2)),ctr=KC.map((c,i)=>[c[0]+(mc[i][0]-c[0])*a3,c[1]+(mc[i][1]-c[1])*a3]);let s='';
if(a3>0)ctr.forEach((c,i)=>{const r=Math.max.apply(null,KP.filter((p,j)=>asg[j]==i).map(p=>Math.hypot(p[0]-c[0],p[1]-c[1])))+16;s+=`<circle cx="${c[0]}" cy="${c[1]}" r="${r}" fill="${F.U.t}" opacity="${.7*a3}" stroke="${U}" stroke-dasharray="5 4"/>`});
if(a2>0)KP.forEach((p,j)=>{const c=ctr[asg[j]];s+=`<line x1="${p[0]}" y1="${p[1]}" x2="${c[0]}" y2="${c[1]}" stroke="${U}" opacity="${.35*a2}"/>`});
KP.forEach(p=>s+=`<circle cx="${p[0]}" cy="${p[1]}" r="6" fill="${ST}" opacity="${.55*(1-a2)}"/><circle cx="${p[0]}" cy="${p[1]}" r="6" fill="${U}" opacity="${a2}"/>`);
if(a1>0)ctr.forEach(c=>s+=`<polygon opacity="${a1}" points="${c[0]},${c[1]-12} ${c[0]+12},${c[1]} ${c[0]},${c[1]+12} ${c[0]-12},${c[1]}" fill="${P.bg}" stroke="${U}" stroke-width="3.5"/>`);
const m=['1. Unlabeled data','2. Pick 3 starting centers (diamonds)','3. Each dot joins its nearest center','4. Move each center to the middle of its group'];
return s+T(300,18,m[n],{f:n?U:ST,w:1,s:16})+T(580,282,'Step '+(n+1)+' of 4',{a:'end'})}

const PT=[];for(let i=0;i<28;i++){const u=((i*53)%100-50)*3.6,v=((i*29)%100-50)*1.1,w=((i*17)%11-5)*2;PT.push({u:u,v:v,sx:u-0.1*v+0.5*(0.6*u-0.5*v+w),sy:0.15*u+v+0.35*(0.6*u-0.5*v+w)})}
function pca(st){const U=F.U.c,t=st.pca/100,cx=300,cy=150;let s=dfs();
PT.forEach(p=>s+=`<circle cx="${cx+(1-t)*p.sx+t*p.u}" cy="${cy-((1-t)*p.sy+t*p.v)}" r="6" fill="${U}" opacity=".8"/>`);
s+=`<g opacity="${t}"><line x1="${cx}" y1="${cy}" x2="${cx+215}" y2="${cy}" stroke="${ST}" stroke-width="2" marker-end="url(#ah)"/><line x1="${cx}" y1="${cy}" x2="${cx}" y2="${cy-95}" stroke="${ST}" stroke-width="2" marker-end="url(#ah)"/>${T(cx+225,cy+4,'PC1',{a:'start',f:U,w:1})}${T(cx+10,cy-100,'PC2',{a:'start',f:U,w:1})}</g>`;
return s+T(300,282,t<0.5?'3 features (a 3D cloud)':'2 features (flat, most information kept)',{f:U,w:1,s:16})}

const QP=[[0,3],[0,2],[0,1],[0,0],[1,0],[2,0],[3,0],[4,0]];
function q(st){const C=F.R.c,x0=125,y0=20,cw=70,ch=65,cx=c=>x0+c*cw+cw/2,cy=r=>y0+r*ch+ch/2;let s='';
for(let r=0;r<4;r++)for(let c=0;c<5;c++){let f=F.R.t;if(c==4&&r==0)f=P.goal;if((c==2&&r==1)||(c==3&&r==2))f=P.trap;s+=`<rect x="${x0+c*cw+2}" y="${y0+r*ch+2}" width="${cw-4}" height="${ch-4}" rx="6" fill="${f}"/>`}
s+=T(cx(4),cy(0)+6,'+10',{f:P.gt,s:18,w:1})+T(cx(2),cy(1)+6,'−10',{f:P.tl,s:18,w:1})+T(cx(3),cy(2)+6,'−10',{f:P.tl,s:18,w:1});
const qd=st.qd??st.q,i0=Math.floor(qd),i1=Math.min(7,i0+1),fr=qd-i0,a=[QP[i0][0]+(QP[i1][0]-QP[i0][0])*fr,QP[i0][1]+(QP[i1][1]-QP[i0][1])*fr];
if(qd>0)s+=`<polyline points="${QP.slice(0,i0+1).map(p=>cx(p[0])+','+cy(p[1])).join(' ')} ${cx(a[0])},${cy(a[1])}" fill="none" stroke="${C}" stroke-width="3" stroke-dasharray="6 5" opacity=".6"/>`;
s+=`<circle cx="${cx(a[0])}" cy="${cy(a[1])}" r="16" fill="${C}" stroke="${P.bg}" stroke-width="3"/>`;
s+=`<circle cx="30" cy="68" r="9" fill="${C}"/>`+T(48,73,'Agent',{a:'start'})+`<rect x="20" y="96" width="20" height="16" rx="3" fill="${P.goal}"/>`+T(48,110,'Goal',{a:'start'})+`<rect x="20" y="126" width="20" height="16" rx="3" fill="${P.trap}"/>`+T(48,140,'Trap',{a:'start'});
return s+T(488,40,'Steps: '+st.q,{a:'start',w:1})+(st.q==7&&qd>6.9?T(488,64,'Reward: +10',{a:'start',f:C,w:1}):'')}

const D={lr,tree,knn,km,pca,q};
const X={lr:['Linear Regression','Finds the straight line that best fits the data to predict a number.','Predicting house prices','S'],
tree:['Decision Trees','Makes a decision by asking a series of yes/no questions.','Approving or rejecting loan applications','S'],
knn:['k-Nearest Neighbors','Gives a new point the label of the points closest to it.','Recommending movies based on similar users','S'],
km:['k-Means Clustering','Groups similar data points together without being told the groups.','Grouping customers by shopping behavior','U'],
pca:['PCA (Principal Component Analysis)','Shrinks many features into fewer ones while keeping the most important information.','Simplifying data with many features so it is easier to plot','U'],
q:['Q-Learning','Learns the best actions by trying things and collecting rewards.','Training game-playing AI and robots','R']};
const bd=f=>`<span class="b" style="background:var(--c${f})">${F[f].n}</span>`;
const dg=(k,fx)=>`<svg class="d" data-k="${k}" ${fx?'data-f="1"':''} viewBox="0 0 600 290" role="img" aria-label="${X[k][0]} diagram"></svg>`;
function ctl(k){const f=X[k][3],o={lr:`<span>House size</span><input type="range" min="5" max="95" value="50" oninput="st.lr=+this.value;R('lr')">`,
tree:TP.map((p,i)=>`<button data-i="${i}" onclick="st.tree=${i};R('tree')">${p.n}</button>`).join(''),
knn:`<span>k (neighbors)</span><input type="range" min="1" max="7" step="2" value="3" oninput="st.knn=+this.value;tw('knr',kR(st.knn),250,'knn')">`,
km:`<button class="p" onclick="kmn()">Next step</button>`,
pca:`<span>Flatten</span><input type="range" min="0" max="100" value="0" oninput="st.pca=+this.value;R('pca')">`,
q:`<button class="p" onclick="qs()">Take a step</button>`}[k];
return `<div class="ctl" style="--c:var(--c${f})">${o}</div>`}
const std=(k,fx)=>{const [n,e,u,f]=X[k];return `${bd(f)}<h1>${n}</h1><div class="row"><div class="L">${dg(k,fx)}${fx?'':ctl(k)}</div><div class="r"><p class="ex">${e}</p><p class="u"><b style="color:var(--c${f})">Use it for:</b> ${u}</p></div></div>`};
const full=k=>`<div class="top">${bd(X[k][3])}<h1>${X[k][0]}</h1></div>${dg(k)}${ctl(k)}`;
const fam=[['S','Learns from labeled examples',['Linear Regression','Decision Trees','k-Nearest Neighbors']],['U','Finds patterns in unlabeled data',['k-Means Clustering','PCA']],['R','Learns by trial and error',['Q-Learning']]];
const rec={S:[['Linear Regression','Predicting house prices'],['Decision Trees','Approving or rejecting loan applications'],['k-Nearest Neighbors','Recommending movies based on similar users']],U:[['k-Means Clustering','Grouping customers by shopping behavior'],['PCA','Simplifying data with many features']],R:[['Q-Learning','Training game-playing AI and robots']]};
const slides=[
['t1',`<h1>Machine Learning Algorithms: Which algorithm do I pick?</h1><div class="bar"><i style="background:var(--cS)"></i><i style="background:var(--cU)"></i><i style="background:var(--cR)"></i></div><p>Instructor: Abubakar A. Hassan</p>`],
['',`<h1 style="margin-bottom:0">The 3 families</h1><div class="cols">${fam.map(f=>`<div class="col" style="background:var(--t${f[0]})">${bd(f[0])}<p><b>${f[1]}</b></p><ul>${f[2].map(a=>`<li>${a}</li>`).join('')}</ul></div>`).join('')}</div>`],
['',std('lr')],['',std('tree')],
['',std('knn',1)],['full',full('knn')],['',std('km',1)],['full',full('km')],['',std('pca',1)],['full',full('pca')],['',std('q',1)],['full',full('q')],
['',`<h1 style="margin-bottom:0">So, which one do I pick?</h1><div class="cols" style="height:400px">${['S','U','R'].map(f=>`<div class="col" style="background:var(--t${f})">${bd(f)}<dl>${rec[f].map(r=>`<dt>${r[0]}</dt><dd>${r[1]}</dd>`).join('')}</dl></div>`).join('')}</div><p class="end">The best choice depends on your data and your goal.</p>`],
['fin',`<div class="fb">${bd('S')}${bd('U')}${bd('R')}</div><div class="fr"><div class="ft"><h1>Thank you for listening</h1><p>Any questions?</p></div><svg id="fx" viewBox="0 0 560 520" role="img" aria-label="Six algorithms arranged around a question mark. Click to make ripples."></svg></div>`]];
const stg=document.getElementById('st');
stg.innerHTML=slides.map(s=>`<section class="s ${s[0]}">${s[1]}</section>`).join('');
const els=stg.children;let cur=0;
function R(k){document.querySelectorAll(k?'svg.d[data-k="'+k+'"]':'svg.d').forEach(e=>{e.innerHTML=D[e.dataset.k](e.dataset.f?INTRO:st)});
document.querySelectorAll('button[data-i]').forEach(b=>b.classList.toggle('on',+b.dataset.i==st.tree))}
let anT;
function show(i){const p=cur;cur=Math.max(0,Math.min(els.length-1,i));
if(p!==cur){document.body.dataset.d=cur>p?'f':'b';const o=els[p];o.classList.add('o');setTimeout(()=>o.classList.remove('o'),220)}
[].forEach.call(els,(e,j)=>{e.classList.toggle('a',j==cur);if(j==cur)e.classList.remove('o')});
const sv=document.querySelectorAll('svg.d');sv.forEach(e=>e.classList.remove('an'));els[cur].querySelectorAll('svg.d').forEach(e=>e.classList.add('an'));clearTimeout(anT);anT=setTimeout(()=>sv.forEach(e=>e.classList.remove('an')),1400)}
function go(d){show(cur+d)}
function fit(){const s=Math.min(innerWidth/1280,innerHeight/720);stg.style.transform=`translate(-50%,-50%) scale(${s})`}
addEventListener('resize',fit);
addEventListener('keydown',e=>{if(['ArrowRight','PageDown'].includes(e.key))go(1);if(['ArrowLeft','PageUp'].includes(e.key))go(-1)});
const TH={light:{bg:'#FAFAF8',tx:'#1F2933',st:'#57534E',bt:'#fff',S:['#2563EB','#DBEAFE'],U:['#0F766E','#CCFBF1'],R:['#C2410C','#FFEDD5'],goal:'#FDBA74',trap:'#D6D3D1',gt:'#C2410C',tl:'#57534E'},dark:{bg:'#12141A',tx:'#F1F5F9',st:'#A8A29E',bt:'#0B1220',S:['#60A5FA','#16264D'],U:['#2DD4BF','#0B3B38'],R:['#FB923C','#4A2410'],goal:'#9A3412',trap:'#44403C',gt:'#FFF7ED',tl:'#F1F5F9'}};
function theme(m){const t=TH[m],r=document.documentElement.style;P=t;ST=t.st;TX=t.tx;
['bg','tx','st','bt'].forEach(k=>r.setProperty('--'+k,t[k]));
['S','U','R'].forEach(f=>{F[f].c=t[f][0];F[f].t=t[f][1];r.setProperty('--c'+f,t[f][0]);r.setProperty('--t'+f,t[f][1])});
document.body.dataset.m=m;document.getElementById('tg').setAttribute('aria-pressed',m=='dark');
try{localStorage.setItem('mlm',m)}catch(e){}R()}
const tog=()=>theme(document.body.dataset.m=='dark'?'light':'dark');
addEventListener('keydown',e=>{if(e.key=='d'||e.key=='D')tog()});
const NS=[['Linear Regression','S'],['Decision Trees','S'],['k-Nearest Neighbors','S'],['k-Means Clustering','U'],['PCA','U'],['Q-Learning','R']];
const fx=document.getElementById('fx'),pl=[0,0,0,0,0,0],pos=[],rps=[],rm=matchMedia('(prefers-reduced-motion:reduce)').matches;let ang=0,rc=0;
fx.innerHTML=`<ellipse cx="280" cy="260" rx="190" ry="165" fill="none" style="stroke:var(--st)" stroke-opacity=".35" stroke-dasharray="4 8"/><g class="qm"><circle cx="280" cy="260" r="70" style="fill:var(--tU)"/><text x="280" y="294" text-anchor="middle" style="font:700 96px Poppins,sans-serif;fill:var(--tx)">?</text></g><g id="rp"></g>`+NS.map((n,i)=>`<g class="nd" onclick="hit(event,${i})"><circle r="17" style="fill:var(--c${n[1]})"/><text y="42" text-anchor="middle" style="font:700 18px Inter,sans-serif;fill:var(--tx)">${n[0]}</text></g>`).join('');
const nds=fx.querySelectorAll('.nd');
nds.forEach((n,i)=>{const a=-Math.PI/2+i*Math.PI/3,x=280+190*Math.cos(a),y=260+165*Math.sin(a);pos[i]=[x,y];n.setAttribute('transform','translate('+x+','+y+')')});
function rip(x,y,f){const e=document.createElementNS('http://www.w3.org/2000/svg','circle');e.setAttribute('cx',x);e.setAttribute('cy',y);e.setAttribute('fill','none');e.setAttribute('stroke-width','3');e.style.stroke='var(--c'+f+')';document.getElementById('rp').appendChild(e);rps.push({e:e,a:0})}
function hit(ev,i){ev.stopPropagation();pl[i]=1;rip(pos[i][0],pos[i][1],NS[i][1])}
fx.onclick=e=>{const p=fx.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const m=p.matrixTransform(fx.getScreenCTM().inverse());rip(m.x,m.y,'SUR'[rc++%3])};
function loop(){if(els[cur].classList.contains('fin')){
nds.forEach((n,i)=>{pl[i]*=.94;n.firstChild.setAttribute('r',17+14*pl[i])});
for(let j=rps.length-1;j>=0;j--){const o=rps[j];o.a+=.02;o.e.setAttribute('r',8+o.a*120);o.e.setAttribute('opacity',1-o.a);if(o.a>=1){o.e.remove();rps.splice(j,1)}}}
requestAnimationFrame(loop)}
const tws={};
function tw(key,to,ms,k){const from=st[key]===undefined?to:st[key],t0=performance.now();cancelAnimationFrame(tws[key]);
if(rm){st[key]=to;R(k);return}
const f=now=>{const p=Math.min(1,(now-t0)/ms),e=1-Math.pow(1-p,3);st[key]=from+(to-from)*e;R(k);if(p<1)tws[key]=requestAnimationFrame(f)};tws[key]=requestAnimationFrame(f)}
function kmn(){const n=(st.km+1)%4;st.km=n;if(n){tw('kmd',n,450,'km')}else{cancelAnimationFrame(tws.kmd);st.kmd=0;R('km')}}
function qs(){const n=(st.q+1)%8;st.q=n;if(n){tw('qd',n,350,'q')}else{cancelAnimationFrame(tws.qd);st.qd=0;R('q')}}
st.knr=kR(3);st.kmd=0;st.qd=0;
let m0='light';try{m0=localStorage.getItem('mlm')||'light'}catch(e){}
document.body.dataset.d='f';fit();theme(m0);show(0);loop();

</script></body></html>
